[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-social-studio"
version = "2.1.0"
description = "Free, Hermes-directed AI media studio on Kaggle GPUs with an optimal-time publisher on GitHub Actions for Facebook, Instagram, Threads, YouTube, Bluesky and Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["requests>=2.31", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
social = "socialstudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
