# Once a day: read engagement, teach the scheduler, delete media of finished posts.
name: insights
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-state
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCIAL_VAULT_PASSPHRASE: ${{ secrets.SOCIAL_VAULT_PASSPHRASE }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q .
      - name: Learn from engagement
        if: env.SOCIAL_VAULT_PASSPHRASE != ''
        run: social insights
      - name: Delete media of finished posts
        if: env.SOCIAL_VAULT_PASSPHRASE != ''
        run: social cleanup
